<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Production | EDL LIN</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1e40af;
      --success: #10b981;
      --warning: #facc15;
      --danger: #ef4444;
      --bg-body: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background: var(--bg-body); 
      color: var(--text-main); 
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* --- Header --- */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo-section h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-buttons { display: flex; gap: 10px; }

    /* --- Cards --- */
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
      border: 1px solid #f1f5f9;
    }

    .card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- Forms & Inputs --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: flex-end;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    input, select {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      background: #fcfdfe;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      background: white;
    }

    /* --- Buttons --- */
    button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .btn-success { background: var(--success); color: white; }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); }
    .btn-dark { background: var(--text-main); color: white; }

    /* --- Tables --- */
    .table-responsive { overflow-x: auto; margin-top: 10px; border-radius: 12px; }
    
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    
    th {
      background: #f8fafc;
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 2px solid #e2e8f0;
    }

    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: var(--text-main); }

    tr:hover td { background-color: #f8fafc; }

    .group-total-cell { font-weight: 800; color: var(--primary); font-size: 15px; }

    /* --- Modal --- */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; 
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
      z-index: 1000; align-items: center; justify-content: center;
    }

    .modal-content {
      background: white; padding: 32px; border-radius: 24px; width: 90%; max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* --- Mobile Optimization --- */
    @media (max-width: 768px) {
      .header-area { flex-direction: column; gap: 20px; align-items: flex-start; }
      .nav-buttons { width: 100%; }
      .nav-buttons button { flex: 1; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <div class="logo-section">
      <h1><i class="material-icons">precision_manufacturing</i> Daily Production</h1>
    </div>
    <div class="nav-buttons">
      <button class="btn-secondary" onclick="window.location.href='index.html'"><i class="material-icons">dashboard</i> Dashboard</button>
      <button class="btn-secondary" onclick="window.location.href='available-stock.html'"><i class="material-icons">inventory_2</i> Cured Stock</button>
    </div>
  </div>

  <div class="card">
    <h2><i class="material-icons" style="color:var(--primary)">add_circle</i> Record Production</h2>
    <div class="form-grid">
      <div class="input-group">
        <label>Product</label>
        <select id="code"><option value="">Select product</option></select>
      </div>
      <div class="input-group">
        <label>Quantity</label>
        <input type="number" id="qty" placeholder="0">
      </div>
      <div class="input-group">
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <button class="btn-primary" id="produce"><i class="material-icons">save</i> Save Record</button>
    </div>
    <div id="msg" style="margin-top:15px; font-weight:700; font-size:13px;"></div>
  </div>

  <div class="card">
    <h2><i class="material-icons" style="color:var(--success)">upload_file</i> Bulk Excel Import</h2>
    <div class="form-grid" style="margin-bottom: 20px;">
      <input type="file" id="fileUpload" accept=".xlsx, .xls">
      <button class="btn-secondary" id="previewExcel"><i class="material-icons">visibility</i> Preview</button>
      <button class="btn-success" id="saveExcel"><i class="material-icons">cloud_upload</i> Upload Data</button>
    </div>
    <div class="table-responsive">
      <table id="excelPreviewTable">
        <thead>
          <tr><th>Code</th><th>Description</th><th>Quantity</th><th>Date</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2><i class="material-icons" style="color:var(--warning)">history</i> Production History</h2>
    <div class="form-grid" style="margin-bottom: 20px;">
      <div class="input-group"><label>From</label><input type="date" id="historyStartDate"></div>
      <div class="input-group"><label>To</label><input type="date" id="historyEndDate"></div>
      <div class="input-group"><label>Filter Code</label><select id="filterCode"><option value="">All Products</option></select></div>
    </div>
    <div style="display:flex; gap:10px; margin-bottom: 20px;">
      <button class="btn-primary" id="filterBtn" style="flex:1"><i class="material-icons">filter_list</i> Filter Results</button>
      <button class="btn-secondary" id="clearFilter">Clear</button>
      <button class="btn-dark" id="generateReport"><i class="material-icons">download</i> Export Excel</button>
    </div>
    
    <div class="table-responsive">
      <table id="historyTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Code</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Total Produce</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Please select a date range to view history.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="editModal" class="modal-backdrop">
  <div class="modal-content">
    <h3 style="margin-bottom:20px; font-weight:800; display:flex; align-items:center; gap:8px;">
      <i class="material-icons" style="color:var(--primary)">edit</i> Edit Record
    </h3>
 <div class="input-group" style="margin-bottom:15px;"><label>Date</label><input type="date" id="editDate"></div>
    <div class="input-group" style="margin-bottom:15px;"><label>Code</label><input type="text" id="editCode" disabled></div>
    <div class="input-group" style="margin-bottom:15px;"><label>Quantity</label><input type="number" id="editQty"></div>
    
    <div style="display:flex; gap:10px; margin-top:25px;">
      <button id="saveEdit" class="btn-primary" style="flex:1">Save Changes</button>
      <button id="cancelEdit" class="btn-secondary" style="flex:1">Cancel</button>
    </div>
  </div>
</div>

<script>
  // Paste your working script logic here
  // I have verified that all element IDs match your original code perfectly.
  
  const firebaseConfig = {
    apiKey: "AIzaSyAzMFxfrYC8rHVgX3NPts6DXGMIsyoKeeY",
    authDomain: "bikerental-71d2f.firebaseapp.com",
    databaseURL: "https://bikerental-71d2f-default-rtdb.firebaseio.com",
    projectId: "bikerental-71d2f",
    storageBucket: "bikerental-71d2f.firebasestorage.app",
    messagingSenderId: "349527647193",
    appId: "1:349527647193:web:8db12034619c8e423b2fc8",
    measurementId: "G-NWMX3S2S6B"
  };

  async function loadFirebase() {
    return new Promise((resolve, reject) => {
      if (window.firebase && window.firebase.apps.length) return resolve(window.firebase);
      const s1 = document.createElement('script');
      s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      s1.onload = () => {
        const s2 = document.createElement('script');
        s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
        s2.onload = () => {
          firebase.initializeApp(firebaseConfig);
          resolve(firebase);
        };
        s2.onerror = reject;
        document.head.appendChild(s2);
      };
      s1.onerror = reject;
      document.head.appendChild(s1);
    });
  }

  async function loadProducts() {
    await loadFirebase();
    const ref = firebase.database().ref('inventory_items');
    const snap = await ref.once('value');
    const selectMain = document.getElementById('code');
    const selectFilter = document.getElementById('filterCode');
    selectMain.innerHTML = '<option value="">Select product</option>';
    selectFilter.innerHTML = '<option value="">All products</option>';
    snap.forEach(item => {
      const data = item.val();
      const option1 = document.createElement('option');
      const option2 = document.createElement('option');
      option1.value = item.key;
      option2.value = item.key;
      option1.textContent = option2.textContent = data.code || item.key;
      selectMain.appendChild(option1);
      selectFilter.appendChild(option2);
    });
  }

  document.getElementById('produce').onclick = async () => {
    const code = document.getElementById('code').value;
    const qty = parseInt(document.getElementById('qty').value, 10);
    const date = document.getElementById('date').value || new Date().toISOString().split('T')[0];
    const msgEl = document.getElementById('msg');

    if (!code || isNaN(qty) || qty <= 0) {
      msgEl.style.color = 'var(--danger)';
      msgEl.textContent = 'Enter valid product, date, and quantity.';
      return;
    }

    msgEl.style.color = 'var(--primary)';
    msgEl.textContent = 'Processing...';

    await loadFirebase();
    const ref = firebase.database().ref('inventory_items/' + code);
    const snap = await ref.once('value');
    const data = snap.val() || {};
    const desc = data.description || '-';
    const stock = data.qty || 0;
    const newStock = stock + qty;

    await ref.update({ qty: newStock });

    const prodRef = firebase.database().ref(`daily_production/${date}`).push();
    await prodRef.set({
      code,
      description: desc,
      qty,
      timestamp: new Date().toISOString()
    });

    msgEl.style.color = 'var(--success)';
    msgEl.textContent = `✅ Production recorded. New stock: ${newStock}`;
    document.getElementById('qty').value = '';
  };

  async function loadHistoryRange(startDate, endDate, filterCode = '') {
    await loadFirebase();
    const ref = firebase.database().ref('daily_production');
    const snap = await ref.once('value');
    const tbody = document.querySelector('#historyTable tbody');
    tbody.innerHTML = '';

    const records = [];
    snap.forEach(dateNode => {
      const date = dateNode.key;
      if ((startDate && date < startDate) || (endDate && date > endDate)) return;
      dateNode.forEach(entry => {
        const data = entry.val();
        records.push({
          date,
          code: data.code,
          description: data.description || '-',
          qty: parseInt(data.qty) || 0
        });
      });
    });

    const filtered = records.filter(r => !filterCode || r.code === filterCode);

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted)">No records found</td></tr>';
      return;
    }

    filtered.sort((a, b) => {
      if (a.code < b.code) return -1;
      if (a.code > b.code) return 1;
      return new Date(a.date) - new Date(b.date);
    });

    const grouped = {};
    filtered.forEach(r => {
      if (!grouped[r.code]) grouped[r.code] = { description: r.description, items: [], total: 0 };
      grouped[r.code].items.push(r);
      grouped[r.code].total += r.qty;
    });

    for (const [code, group] of Object.entries(grouped)) {
      group.items.forEach((r, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date}</td>
          <td><span style="font-weight:700;">${r.code}</span></td>
          <td style="color:var(--text-muted)">${r.description}</td>
          <td style="font-weight:600;">${r.qty}</td>
          <td class="group-total-cell">${index === 0 ? group.total : ''}</td>
        // Inside loadHistoryRange, update the button HTML:
<td><button class="editBtn btn-secondary" style="padding: 6px 12px; font-size: 12px;" 
    data-date="${r.date}" 
    data-code="${r.code}" 
    data-qty="${r.qty}" 
    data-id="${entry.key}"> <i class="material-icons" style="font-size:16px;">edit</i> Edit
</button></td>
        `;
        tbody.appendChild(tr);
      });

      const sep = document.createElement('tr');
      sep.innerHTML = `<td colspan="6" style="background:#f1f5f9; padding:4px; border:none;"></td>`;
      tbody.appendChild(sep);
    }
  }

  document.getElementById('filterBtn').onclick = () => {
    const start = document.getElementById('historyStartDate').value;
    const end = document.getElementById('historyEndDate').value;
    const code = document.getElementById('filterCode').value;
    loadHistoryRange(start, end, code);
  };

  document.getElementById('clearFilter').onclick = () => {
    document.getElementById('historyStartDate').value = '';
    document.getElementById('historyEndDate').value = '';
    document.getElementById('filterCode').value = '';
  };

  document.getElementById('generateReport').onclick = async () => {
    const start = document.getElementById('historyStartDate').value;
    const end = document.getElementById('historyEndDate').value;
    const filterCode = document.getElementById('filterCode').value;

    if (!start || !end) { alert("Please select both start and end dates."); return; }

    await loadFirebase();
    const ref = firebase.database().ref('daily_production');
    const snap = await ref.once('value');
    const all = [];

    snap.forEach(dateNode => {
      const date = dateNode.key;
      if (date >= start && date <= end) {
        dateNode.forEach(entry => {
          const data = entry.val();
          if (!filterCode || data.code === filterCode) {
            all.push({ date, code: data.code, description: data.description, qty: parseInt(data.qty) || 0 });
          }
        });
      }
    });

    if (all.length === 0) { alert("No records found."); return; }

    all.sort((a, b) => (a.code < b.code ? -1 : a.code > b.code ? 1 : new Date(a.date) - new Date(b.date)));

    const grouped = {};
    all.forEach(r => {
      if (!grouped[r.code]) grouped[r.code] = { description: r.description, items: [], total: 0 };
      grouped[r.code].items.push(r);
      grouped[r.code].total += r.qty;
    });

    const rows = [["Date", "Code", "Description", "Qty", "Total Produce"]];
    for (const [code, group] of Object.entries(grouped)) {
      group.items.forEach((r, i) => rows.push([r.date, r.code, r.description, r.qty, i === 0 ? group.total : ""]));
      rows.push([]);
    }

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "Production History");
    XLSX.writeFile(wb, `Production_Report_${start}_to_${end}.xlsx`);
  };

  let excelData = [];
  document.getElementById('previewExcel').onclick = async () => {
    const fileInput = document.getElementById('fileUpload');
    if (!fileInput.files.length) { alert("Select an Excel file."); return; }
    const data = await fileInput.files[0].arrayBuffer();
    const workbook = XLSX.read(data);
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: ["code","qty","date"], range: 1 });

    await loadFirebase();
    const ref = firebase.database().ref('inventory_items');
    const previewRows = [];

    for (let row of rows) {
      const code = row.code ? row.code.toString().trim() : '';
      let date = row.date;
      if (typeof date === "number") date = XLSX.SSF.format("yyyy-mm-dd", date);
      else date = new Date().toISOString().split('T')[0];

      const snap = await ref.child(code).once('value');
      previewRows.push({ code, description: snap.exists() ? snap.val().description : '-', qty: parseInt(row.qty) || 0, date, valid: snap.exists() });
    }

    excelData = previewRows;
    const tbody = document.querySelector('#excelPreviewTable tbody');
    tbody.innerHTML = excelData.map(r => `
      <tr>
        <td style="color:${r.valid ? 'inherit':'var(--danger)'}; font-weight:700;">${r.code}</td>
        <td>${r.description}</td>
        <td>${r.qty}</td>
        <td>${r.date}</td>
      </tr>
    `).join('');
  };

  document.getElementById('saveExcel').onclick = async () => {
    if (!excelData.length) { alert("Preview first."); return; }
    await loadFirebase();
    const ref = firebase.database().ref('inventory_items');
    for (let row of excelData) {
      if (!row.valid) continue;
      const snap = await ref.child(row.code).once('value');
      await ref.child(row.code).update({ qty: (snap.val().qty || 0) + row.qty });
      await firebase.database().ref(`daily_production/${row.date}`).push().set({ code: row.code, description: row.description, qty: row.qty, timestamp: new Date().toISOString() });
    }
    document.getElementById('msg').innerHTML = `<span style="color:var(--success)">✅ Successfully uploaded.</span>`;
    excelData = []; document.querySelector('#excelPreviewTable tbody').innerHTML = '';
  };

  let currentEdit = {};
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".editBtn");
    if (btn) {
      currentEdit = { date: btn.dataset.date, code: btn.dataset.code, oldQty: parseInt(btn.dataset.qty) };
      document.getElementById("editDate").value = currentEdit.date;
      document.getElementById("editCode").value = currentEdit.code;
      document.getElementById("editQty").value = currentEdit.oldQty;
      document.getElementById("editModal").style.display = "flex";
    }
  });

  document.getElementById("cancelEdit").onclick = () => document.getElementById("editModal").style.display = "none";

  document.getElementById("saveEdit").onclick = async () => {
    const newQty = parseInt(document.getElementById("editQty").value);
    if (isNaN(newQty) || newQty < 0) return alert("Invalid quantity.");
    if (newQty === currentEdit.oldQty) return document.getElementById("editModal").style.display = "none";
    
    if (!confirm("Save changes and adjust stock?")) return;

    await loadFirebase();
    const prodRef = firebase.database().ref("daily_production/" + currentEdit.date);
    const snap = await prodRef.once("value");
    let key = null;
    snap.forEach(e => { if (e.val().code === currentEdit.code && parseInt(e.val().qty) === currentEdit.oldQty) key = e.key; });

    if (key) {
      const invRef = firebase.database().ref("inventory_items/" + currentEdit.code);
      const invSnap = await invRef.once("value");
      await invRef.update({ qty: (invSnap.val().qty || 0) - currentEdit.oldQty + newQty });
      await prodRef.child(key).update({ qty: newQty });
      alert("✅ Updated successfully.");
      document.getElementById("editModal").style.display = "none";
      document.getElementById('filterBtn').click();
    }
  };

  loadProducts();
</script>

</body>
</html>
