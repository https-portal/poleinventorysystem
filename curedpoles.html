<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cured Stock | Pole Inventory</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #0ea5e9;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-body: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-body); color: var(--text-main); }

    /* --- Header --- */
    header {
      background: #fff;
      padding: 16px 0;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1000px; margin: 0 auto; width: 92%; }
    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .badge { background: #e0f2fe; color: var(--secondary); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }

    .btn-nav {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-nav:hover { background: #f1f5f9; }

    /* --- Main --- */
    main { padding: 30px 0; }
    .info-banner {
      background: #eff6ff;
      border-left: 4px solid var(--secondary);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Controls */
    .controls-card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 24px;
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }
    .input-group { flex: 1; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    
    input[type="date"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-weight: 600;
      background: #f8fafc;
    }

    .btn-show {
      background: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-show:hover { background: #4f46e5; }

    /* Table */
    .table-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th { padding: 16px; text-align: left; background: #f8fafc; font-size: 13px; color: var(--text-muted); font-weight: 700; }
    td { padding: 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

    .ready-pill {
      background: #ecfdf5;
      color: var(--success);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      display: inline-block;
    }

    /* Loading Spinner */
    .loading-overlay {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .controls-card { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<header>
  <div class="container header-flex">
    <div class="logo-area">
      <span class="badge">Quality Control</span>
      <h2 style="font-size: 18px; font-weight: 800;">Available Cured Stock</h2>
    </div>
    <button class="btn-nav" onclick="window.location.href='index.html'">
      <i class="material-icons">dashboard</i> Dashboard
    </button>
  </div>
</header>

<main class="container">
  <div class="info-banner">
    <i class="material-icons">info</i>
    <span>Stock is considered <b>Cured</b> only after 14 days of production. This report automatically subtracts "fresh" stock from your totals.</span>
  </div>

  <div class="controls-card">
    <div class="input-group">
      <label>Availability Date</label>
      <input type="date" id="datePicker">
    </div>
    <button id="showBtn" class="btn-show">
      <i class="material-icons">verified</i> Show Cured Poles
    </button>
  </div>

  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <p style="font-weight: 600; color: var(--primary);">Calculating readiness...</p>
  </div>

  <div class="table-card" id="resultCard" style="display: none;">
    <table id="stockTable">
      <thead>
        <tr>
          <th>Product Code</th>
          <th>Description</th>
          <th>Total Warehouse</th>
          <th>Still Curing ( < 14d )</th>
          <th>Ready to Ship</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzMFxfrYC8rHVgX3NPts6DXGMIsyoKeeY",
  authDomain: "bikerental-71d2f.firebaseapp.com",
  databaseURL: "https://bikerental-71d2f-default-rtdb.firebaseio.com",
  projectId: "bikerental-71d2f",
  storageBucket: "bikerental-71d2f.firebasestorage.app",
  messagingSenderId: "349527647193",
  appId: "1:349527647193:web:8db12034619c8e423b2fc8",
  measurementId: "G-NWMX3S2S6B"
};

let cachedInventory = {};
let firebaseLoaded = false;

async function loadFirebase() {
  if (firebaseLoaded) return;
  return new Promise((resolve) => {
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
      s2.onload = () => {
        firebase.initializeApp(firebaseConfig);
        firebaseLoaded = true;
        resolve();
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  });
}

async function handleShowStock() {
  const dateVal = document.getElementById("datePicker").value;
  if (!dateVal) return alert("Please select a date.");

  const loader = document.getElementById("loading");
  const tableCard = document.getElementById("resultCard");
  
  loader.style.display = "block";
  tableCard.style.display = "none";

  try {
    await loadFirebase();
    const db = firebase.database();
    
    const [invSnap, prodSnap] = await Promise.all([
      db.ref("inventory_items").once("value"),
      db.ref("daily_production").once("value")
    ]);

    const inventory = invSnap.val() || {};
    const allProduction = prodSnap.val() || {};
    const selectedDate = new Date(dateVal);
    
    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    for (const [code, item] of Object.entries(inventory)) {
      let freshStock = 0;

      for (const dateKey in allProduction) {
        const prodDate = new Date(dateKey);
        const diffDays = (selectedDate - prodDate) / (1000*60*60*24);
        
        // If production was less than 14 days before the selected date
        if (diffDays >= 0 && diffDays < 14) {
          const dailyProd = allProduction[dateKey];
          for (const key in dailyProd) {
            if (dailyProd[key].code === code) {
              freshStock += parseInt(dailyProd[key].qty) || 0;
            }
          }
        }
      }

      const totalWarehouse = item.qty || 0;
      const curedTotal = Math.max(0, totalWarehouse - freshStock);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${code}</b></td>
        <td style="color:var(--text-muted)">${item.description || '-'}</td>
        <td>${totalWarehouse}</td>
        <td style="color:var(--danger); font-weight:600;">${freshStock}</td>
        <td><span class="ready-pill">${curedTotal}</span></td>
      `;
      tbody.appendChild(tr);
    }

    tableCard.style.display = "block";
  } catch (err) {
    console.error(err);
    alert("Error loading data.");
  } finally {
    loader.style.display = "none";
  }
}

document.getElementById("showBtn").onclick = handleShowStock;

// Set default date to today
document.getElementById('datePicker').valueAsDate = new Date();
</script>

</body>
</html>
