<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Reports | Pole Inventory</title>
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --success: #10b981;
      --bg-body: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --white: #ffffff;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-body); color: var(--text-main); padding-bottom: 60px; }

    header {
      background: #fff;
      padding: 20px 0;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 30px;
    }

    .container { max-width: 1100px; margin: 0 auto; width: 92%; }
    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .badge {
      background: #e0f2fe;
      color: var(--secondary);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-transform: uppercase;
    }

    /* CARDS */
    .card {
      background: var(--white);
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto auto;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    @media (max-width: 850px) {
      .controls-grid { grid-template-columns: 1fr 1fr; }
      .search-box { grid-column: span 2; }
    }

    label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      background: #f8fafc;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    /* BUTTONS */
    button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      font-size: 14px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    
    .btn-outline { background: #f1f5f9; color: var(--text-main); border: 1px solid #e2e8f0; }
    .btn-outline:hover { background: #e2e8f0; }

    .btn-success { background: var(--success); color: white; }

    /* TABLES */
    .table-container { 
      overflow-x: auto; 
      border-radius: 16px; 
      border: 1px solid #e2e8f0; 
      background: white;
      max-height: 600px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 800px; }
    
    th { 
      background: #f8fafc; 
      padding: 16px; 
      text-align: left; 
      font-weight: 700; 
      color: var(--text-muted); 
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td { padding: 16px; border-bottom: 1px solid #f1f5f9; }
    
    tbody tr:hover { background-color: #f8fafc; }

    .total-row {
      background: #eef2ff !important;
      font-weight: 800;
      color: var(--primary);
    }

    .total-row td { border-top: 2px solid var(--primary); }

    .qty-bold { font-weight: 700; color: var(--text-main); }
  </style>
</head>
<body>

<header>
  <div class="container header-flex">
    <h1><span class="badge">Reports</span> Inventory Summary</h1>
    <button class="btn-outline" onclick="window.location.href='index.html'">
      <i class="material-icons">dashboard</i> Dashboard
    </button>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="controls-grid">
      <div class="search-box">
        <label>Search Inventory</label>
        <input type="text" id="searchBar" placeholder="Search by code or description...">
      </div>
      
      <div>
        <label>From Date</label>
        <input type="date" id="startDate">
      </div>
      
      <div>
        <label>To Date</label>
        <input type="date" id="endDate">
      </div>

      <button id="generateBtn" class="btn-primary">
        <i class="material-icons">refresh</i> Generate
      </button>

      <button id="exportBtn" class="btn-success">
        <i class="material-icons">file_download</i> Excel
      </button>
    </div>

    <div class="table-container">
      <table id="reportTable">
        <thead>
          <tr>
            <th>Code</th>
            <th>Description</th>
            <th>Beginning Stock</th>
            <th>Total Produced</th>
            <th>Total Withdrawn</th>
            <th>Current Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="6" style="text-align:center; padding:60px; color:var(--text-muted);">
              <i class="material-icons" style="font-size:48px; display:block; margin-bottom:10px; opacity:0.3;">date_range</i>
              Set a date range and click Generate to see data
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAzMFxfrYC8rHVgX3NPts6DXGMIsyoKeeY",
      authDomain: "bikerental-71d2f.firebaseapp.com",
      databaseURL: "https://bikerental-71d2f-default-rtdb.firebaseio.com",
      projectId: "bikerental-71d2f",
      storageBucket: "bikerental-71d2f.firebasestorage.app",
      messagingSenderId: "349527647193",
      appId: "1:349527647193:web:8db12034619c8e423b2fc8",
      measurementId: "G-NWMX3S2S6B"
    };

    async function loadFirebase() {
      return new Promise((resolve) => {
        if (window.firebase && window.firebase.apps.length) return resolve(window.firebase);
        const s1 = document.createElement('script');
        s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
        s1.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
          s2.onload = () => { firebase.initializeApp(firebaseConfig); resolve(firebase); };
          document.head.appendChild(s2);
        }
        document.head.appendChild(s1);
      });
    }

    document.getElementById('generateBtn').onclick = async () => {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return alert("Please select both start and end dates.");

      const btn = document.getElementById('generateBtn');
      btn.innerHTML = '<i class="material-icons">sync</i> Loading...';
      btn.disabled = true;

      await loadFirebase();
      const db = firebase.database();

      const [invSnap, prodSnap, withSnap] = await Promise.all([
        db.ref('inventory_items').once('value'),
        db.ref('daily_production').once('value'),
        db.ref('withdrawals').once('value')
      ]);

      const inventory = invSnap.val() || {};
      const production = prodSnap.val() || {};
      const withdrawals = withSnap.val() || {};
      const report = {};

      for (const [code, item] of Object.entries(inventory)) {
        report[code] = {
          description: item.description || '-',
          produced: 0,
          withdrawn: 0,
          current: item.qty || 0
        };
      }

      for (const [date, entries] of Object.entries(production)) {
        if (date >= start && date <= end) {
          for (const key in entries) {
            const p = entries[key];
            if (report[p.code]) report[p.code].produced += parseInt(p.qty) || 0;
          }
        }
      }

      for (const [key, w] of Object.entries(withdrawals)) {
        if (w.date >= start && w.date <= end) {
          if (report[w.code]) report[w.code].withdrawn += parseInt(w.qty) || 0;
        }
      }

      const tbody = document.querySelector('#reportTable tbody');
      tbody.innerHTML = '';

      let totals = { beg:0, prod:0, with:0, cur:0 };

      for (const [code, r] of Object.entries(report)) {
        const beginning = r.current - r.produced + r.withdrawn;
        totals.beg += beginning;
        totals.prod += r.produced;
        totals.with += r.withdrawn;
        totals.cur += r.current;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${code}</b></td>
          <td>${r.description}</td>
          <td>${beginning}</td>
          <td style="color:var(--success)">+ ${r.produced}</td>
          <td style="color:var(--danger)">- ${r.withdrawn}</td>
          <td class="qty-bold">${r.current}</td>
        `;
        tbody.appendChild(tr);
      }

      const totalRow = document.createElement('tr');
      totalRow.className = 'total-row';
      totalRow.innerHTML = `
        <td colspan="2" style="text-align:right;">OVERALL TOTAL</td>
        <td>${totals.beg}</td>
        <td>${totals.prod}</td>
        <td>${totals.with}</td>
        <td>${totals.cur}</td>
      `;
      tbody.appendChild(totalRow);
      
      btn.innerHTML = '<i class="material-icons">refresh</i> Generate';
      btn.disabled = false;
    };

    document.getElementById('exportBtn').onclick = () => {
      const table = document.getElementById('reportTable');
      const wb = XLSX.utils.table_to_book(table, { sheet: "Inventory Report" });
      XLSX.writeFile(wb, `Inventory_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    };

    document.getElementById('searchBar').addEventListener('keyup', () => {
      const filter = document.getElementById('searchBar').value.toLowerCase();
      const rows = document.querySelectorAll('#reportTable tbody tr:not(.total-row)');
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
      });
    });
</script>

</body>
</html>
