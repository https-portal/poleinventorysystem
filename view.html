<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory Dashboard | Pole Inventory</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #0ea5e9;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --bg-body: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-body); color: var(--text-main); }

    /* --- Header --- */
    header {
      background: #fff;
      padding: 16px 0;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1200px; margin: 0 auto; width: 92%; }
    .header-flex { display: flex; justify-content: space-between; align-items: center; }

    .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    .nav-buttons { display: flex; gap: 10px; }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: white;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:hover { background: #4f46e5; }

    /* --- Content --- */
    main { padding: 30px 0; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    #msg { font-size: 14px; color: var(--success); margin-bottom: 25px; font-weight: 600; }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid #f1f5f9;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover { transform: translateY(-5px); border-color: var(--primary); }
    .stat-card h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 32px; font-weight: 800; margin-top: 8px; }
    
    .card-total .value { color: var(--primary); }
    .card-low .value { color: var(--warning); }
    .card-out .value { color: var(--danger); }

    /* Search & Table */
    .inventory-box {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--card-shadow);
    }
    .search-container { margin-bottom: 20px; position: relative; }
    .search-container i { position: absolute; left: 15px; top: 14px; color: var(--text-muted); }
    #searchBar {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 15px;
      transition: 0.2s;
    }
    #searchBar:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }

    .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #f1f5f9; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { background: #f8fafc; padding: 16px; text-align: left; font-size: 13px; color: var(--text-muted); font-weight: 700; }
    td { padding: 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    
    /* Stock Status Pills */
    .status-pill {
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
    }
    .status-normal { background: #f1f5f9; color: var(--text-main); }
    .status-low { background: #fffbeb; color: var(--warning); border: 1px solid #fef3c7; }
    .status-out { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }

    /* Modal Styling */
    #stockModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 700px;
      border-radius: 24px;
      padding: 30px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .close-modal { position: absolute; right: 20px; top: 20px; cursor: pointer; color: var(--text-muted); }

    @media (max-width: 768px) {
      .header-flex { flex-direction: column; gap: 15px; }
      .nav-buttons { width: 100%; }
      .nav-buttons .btn { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="container header-flex">
    <div class="logo">
      <i class="material-icons">inventory_2</i> Pole Inventory
    </div>
    <div class="nav-buttons">
      <button class="btn" onclick="window.location.href='index.html'">
        <i class="material-icons">home</i> Home
      </button>
      <button class="btn btn-primary" onclick="window.location.href='reports.html'">
        <i class="material-icons">assessment</i> Reports
      </button>
    </div>
  </div>
</header>

<main class="container">
  <h1>Dashboard Overview</h1>
  <div id="msg">Syncing with database...</div>

  <div class="summary-grid">
    <div class="stat-card card-total">
      <h3>Total In Stock</h3>
      <div class="value" id="totalStock">0</div>
    </div>
    <div class="stat-card card-low" id="lowStockCard">
      <h3>Low Stock (&lt;20)</h3>
      <div class="value" id="lowStock">0</div>
    </div>
    <div class="stat-card card-out" id="outStockCard">
      <h3>Out of Stock</h3>
      <div class="value" id="outStock">0</div>
    </div>
  </div>

  <div class="inventory-box">
    <div class="search-container">
      <i class="material-icons">search</i>
      <input type="text" id="searchBar" placeholder="Search by code or item description..." onkeyup="searchInventory()">
    </div>

    <div class="table-wrapper">
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>Product Code</th>
            <th>Description</th>
            <th>Stock Status</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>
  </div>
</main>

<div id="stockModal">
  <div class="modal-content">
    <i class="material-icons close-modal" id="closeModal">close</i>
    <h2 id="modalTitle" style="margin-bottom: 20px;">Stock Details</h2>
    <div class="table-wrapper">
      <table id="modalTable">
        <thead>
          <tr>
            <th>Code</th>
            <th>Description</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody id="modalBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzMFxfrYC8rHVgX3NPts6DXGMIsyoKeeY",
  authDomain: "bikerental-71d2f.firebaseapp.com",
  databaseURL: "https://bikerental-71d2f-default-rtdb.firebaseio.com",
  projectId: "bikerental-71d2f",
  storageBucket: "bikerental-71d2f.firebasestorage.app",
  messagingSenderId: "349527647193",
  appId: "1:349527647193:web:8db12034619c8e423b2fc8",
  measurementId: "G-NWMX3S2S6B"
};

async function init() {
  await loadFirebase();
  fetchData();
}

function loadFirebase() {
  return new Promise((resolve) => {
    if (window.firebase && window.firebase.apps.length) return resolve();
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
      s2.onload = () => { firebase.initializeApp(firebaseConfig); resolve(); }
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  });
}

let allProducts = [];

async function fetchData() {
  const snapshot = await firebase.database().ref('inventory_items').once('value');
  const data = snapshot.val() || {};
  allProducts = Object.entries(data).map(([id, val]) => ({
    id, code: val.code || 'N/A', description: val.description || '', qty: val.qty || 0
  })).sort((a,b) => a.code.localeCompare(b.code));

  renderMainTable(allProducts);
  updateStats(allProducts);
  document.getElementById('msg').textContent = `✅ Last synced: ${new Date().toLocaleTimeString()}`;
}

function renderMainTable(items) {
  const tbody = document.querySelector('#inventoryTable tbody');
  tbody.innerHTML = items.map(p => {
    let statusClass = 'status-normal';
    if(p.qty === 0) statusClass = 'status-out';
    else if(p.qty < 20) statusClass = 'status-low';

    return `
      <tr>
        <td><strong>${p.code}</strong></td>
        <td style="color:var(--text-muted)">${p.description}</td>
        <td><span class="status-pill ${statusClass}">${p.qty}</span></td>
      </tr>
    `;
  }).join('');
}

function updateStats(items) {
  const total = items.reduce((sum, p) => sum + p.qty, 0);
  const low = items.filter(p => p.qty > 0 && p.qty < 20).length;
  const out = items.filter(p => p.qty === 0).length;

  document.getElementById('totalStock').textContent = total;
  document.getElementById('lowStock').textContent = low;
  document.getElementById('outStock').textContent = out;
}

function searchInventory() {
  const term = document.getElementById('searchBar').value.toLowerCase();
  const filtered = allProducts.filter(p => 
    p.code.toLowerCase().includes(term) || 
    p.description.toLowerCase().includes(term)
  );
  renderMainTable(filtered);
}

// Modal Logic
function openModal(type) {
  const filtered = allProducts.filter(p => type === 'low' ? (p.qty > 0 && p.qty < 20) : p.qty === 0);
  const modalBody = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = type === 'low' ? 'Low Stock Alert' : 'Out of Stock Items';
  
  modalBody.innerHTML = filtered.map(p => `
    <tr>
      <td>${p.code}</td>
      <td>${p.description}</td>
      <td style="font-weight:bold; color:${type==='low'?'var(--warning)':'var(--danger)'}">${p.qty}</td>
    </tr>
  `).join('');
  
  document.getElementById('stockModal').style.display = 'flex';
}

document.getElementById('lowStockCard').onclick = () => openModal('low');
document.getElementById('outStockCard').onclick = () => openModal('out');
document.getElementById('closeModal').onclick = () => document.getElementById('stockModal').style.display = 'none';

init();
</script>
</body>
</html>
