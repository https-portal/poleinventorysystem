<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Daily Withdrawal | Pole Inventory</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0ea5e9;
            --danger: #ef4444;
            --success: #10b981;
            --bg-body: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: #fff;
            padding: 20px 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 92%;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        h2, h3 { font-size: 18px; font-weight: 700; margin: 25px 0 15px 0; color: var(--text-main); }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* CARDS */
        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input, select {
            flex: 1;
            min-width: 150px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            background: #f8fafc;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 14px;
        }

        #withdraw { background: var(--primary); color: #fff; }
        #withdraw:hover { background: var(--primary-dark); transform: translateY(-1px); }

        #showdashboard { background: #f1f5f9; color: var(--text-main); }
        #showdashboard:hover { background: #e2e8f0; }

        .btn-filter { background: var(--secondary); color: white; }
        .btn-export { background: var(--success); color: white; width: 100%; justify-content: center; margin-top: 10px; }

        /* TABLE */
        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            padding: 14px;
            text-align: left;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f1f5f9;
        }

        .editBtn {
            padding: 6px 12px;
            background: #f1f5f9;
            color: var(--primary);
            font-size: 12px;
        }

        .editBtn:hover { background: var(--primary); color: white; }

        #msg {
            margin-top: 10px;
            font-weight: 600;
            font-size: 13px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .modal-content label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <div class="container header-flex">
        <h1><span class="badge">Stock Out</span> Daily Withdrawal</h1>
        <button id="showdashboard"><i class="material-icons">dashboard</i> Dashboard</button>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="row">
            <select id="code">
                <option value="">Select product code</option>
            </select>
            <input id="qty" placeholder="Quantity to withdraw" type="number" />
        </div>
        <div class="row">
            <input id="client" placeholder="Client Name / Project" />
            <input id="date" type="date" />
            <button id="withdraw"><i class="material-icons">remove_circle</i> Withdraw Stock</button>
        </div>
        <div id="msg"></div>
    </div>

    <h2>Withdrawal History</h2>
    <div class="card">
        <div class="row">
            <input id="filterDate" type="date" />
            <select id="filterCode">
                <option value="">All products</option>
            </select>
            <button id="filterBtn" class="btn-filter"><i class="material-icons">filter_list</i> Filter</button>
            <button id="clearFilter" style="background:#f1f5f9; color: var(--text-muted);">Clear</button>
        </div>

        <div class="table-container">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Code</th>
                        <th>Description</th>
                        <th>Client</th>
                        <th>Qty</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:40px;">Loading records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <h3>Export Reports</h3>
    <div class="card">
        <div class="row">
            <div style="flex:1">
                <label style="font-size:12px; font-weight:700; color:var(--text-muted)">Start Date</label>
                <input id="startDate" type="date" style="width:100%"/>
            </div>
            <div style="flex:1">
                <label style="font-size:12px; font-weight:700; color:var(--text-muted)">End Date</label>
                <input id="endDate" type="date" style="width:100%"/>
            </div>
            <div style="flex:1">
                <label style="font-size:12px; font-weight:700; color:var(--text-muted)">Client (Optional)</label>
                <input id="clientFilter" placeholder="Filter by client..." style="width:100%"/>
            </div>
        </div>
        <button id="exportBtn" class="btn-export"><i class="material-icons">description</i> Export to Excel (.xlsx)</button>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; margin-bottom:20px;">Edit Transaction</h3>
        
        <label>Transaction Date</label>
        <div class="row"><input id="editDate" type="date"></div>
        
        <label>Client / Destination</label>
        <div class="row"><input id="editClient" type="text"></div>
        
        <label>Withdrawn Quantity</label>
        <div class="row"><input id="editQty" type="number"></div>
        
        <div class="modal-actions">
            <button id="saveEditBtn" style="background:var(--primary); color:white; flex:1;">Save Changes</button>
            <button id="cancelEditBtn" style="background:#f1f5f9; color:var(--text-muted); flex:1;">Cancel</button>
        </div>
    </div>
</div>

<script>
    /* FIREBASE LOGIC UNCHANGED */
    const firebaseConfig = {
      apiKey: "AIzaSyAzMFxfrYC8rHVgX3NPts6DXGMIsyoKeeY",
      authDomain: "bikerental-71d2f.firebaseapp.com",
      databaseURL: "https://bikerental-71d2f-default-rtdb.firebaseio.com",
      projectId: "bikerental-71d2f",
      storageBucket: "bikerental-71d2f.firebasestorage.app",
      messagingSenderId: "349527647193",
      appId: "1:349527647193:web:8db12034619c8e423b2fc8",
      measurementId: "G-NWMX3S2S6B"
    };

    function loadFirebase() {
      return new Promise((resolve, reject) => {
        if (window.firebase && window.firebase.apps.length) return resolve(window.firebase);
        const s1 = document.createElement('script');
        s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
        s1.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
          s2.onload = () => {
            firebase.initializeApp(firebaseConfig);
            resolve(firebase);
          };
          s2.onerror = reject;
          document.head.appendChild(s2);
        };
        s1.onerror = reject;
        document.head.appendChild(s1);
      });
    }

    async function loadProducts() {
      await loadFirebase();
      const ref = firebase.database().ref('inventory_items');
      const snap = await ref.once('value');
      const selectMain = document.getElementById('code');
      const selectFilter = document.getElementById('filterCode');
      selectMain.innerHTML = '<option value="">Select product code</option>';
      selectFilter.innerHTML = '<option value="">All products</option>';

      snap.forEach(item => {
        const data = item.val();
        const code = data.code || item.key;
        const opt1 = new Option(code, item.key);
        const opt2 = new Option(code, item.key);
        selectMain.add(opt1);
        selectFilter.add(opt2);
      });
    }

    document.getElementById('withdraw').onclick = async () => {
      const code = document.getElementById('code').value;
      const qty = parseInt(document.getElementById('qty').value, 10);
      const client = document.getElementById('client').value.trim();
      const date = document.getElementById('date').value || new Date().toISOString().split('T')[0];

      if (!code || isNaN(qty) || qty <= 0 || !client) {
        msgUpdate('Enter valid product, client, and quantity.', 'var(--danger)');
        return;
      }
msgUpdate('Processing withdrawal...', 'var(--primary)');

      await loadFirebase();
      const ref = firebase.database().ref('inventory_items/' + code);
      const snap = await ref.once('value');
      const data = snap.val() || {};
      const stock = data.qty || 0;

      if (stock < qty) {
        msgUpdate(`Insufficient stock! (Current: ${stock})`, 'var(--danger)');
        return;
      }

      const newStock = stock - qty;
      await ref.update({ qty: newStock });

      const key = `${code}_${Date.now()}`;
      await firebase.database().ref('withdrawals/' + key).set({
        code, description: data.description || '-', qty, client, date, timestamp: new Date().toISOString()
      });

      msgUpdate(`✅ Successfully withdrawn. Stock remaining: ${newStock}`, 'var(--success)');
      document.getElementById('qty').value = '';
      document.getElementById('client').value = '';
      loadHistory();
    };

    function msgUpdate(txt, color) {
        const m = document.getElementById('msg');
        m.textContent = txt;
        m.style.color = color;
    }

    async function loadHistory(filterDate = '', filterCode = '') {
      await loadFirebase();
      const ref = firebase.database().ref('withdrawals');
      const snap = await ref.once('value');
      const tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = '';

      const records = [];
      snap.forEach(item => { let d = item.val(); d.key = item.key; records.push(d); });

      const filtered = records.filter(r => (!filterDate || r.date === filterDate) && (!filterCode || r.code === filterCode));

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px;">No records found.</td></tr>';
        return;
      }

      filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      filtered.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date}</td>
          <td><b>${r.code}</b></td>
          <td>${r.description || '-'}</td>
          <td>${r.client || '-'}</td>
          <td>${r.qty}</td>
          <td><button class="editBtn" data-key="${r.key}">Edit</button></td>
        `;
        tbody.appendChild(tr);
      });

      setupEditLogic();
    }

    function setupEditLogic() {
        const modal = document.getElementById('editModal');
        let currentKey = null;

        document.querySelectorAll('.editBtn').forEach(btn => {
            btn.onclick = async () => {
                currentKey = btn.dataset.key;
                const snap = await firebase.database().ref('withdrawals/' + currentKey).once('value');
                const data = snap.val();
                document.getElementById('editDate').value = data.date;
                document.getElementById('editClient').value = data.client;
                document.getElementById('editQty').value = data.qty;
                modal.style.display = 'flex';
            };
        });

        document.getElementById('cancelEditBtn').onclick = () => modal.style.display = 'none';
        
        document.getElementById('saveEditBtn').onclick = async () => {
            const newDate = document.getElementById('editDate').value;
            const newClient = document.getElementById('editClient').value;
            const newQty = parseInt(document.getElementById('editQty').value);

            const ref = firebase.database().ref('withdrawals/' + currentKey);
            const oldSnap = await ref.once('value');
            const oldData = oldSnap.val();
            
            await ref.update({ date: newDate, client: newClient, qty: newQty });

            // Adjust Stock
            const itemRef = firebase.database().ref('inventory_items/' + oldData.code);
            const itemSnap = await itemRef.once('value');
            const currentInv = itemSnap.val().qty || 0;
            await itemRef.update({ qty: currentInv + (oldData.qty - newQty) });

            modal.style.display = 'none';
            loadHistory();
        };
    }

    document.getElementById('filterBtn').onclick = () => loadHistory(document.getElementById('filterDate').value, document.getElementById('filterCode').value);
    document.getElementById('clearFilter').onclick = () => {
        document.getElementById('filterDate').value = '';
        document.getElementById('filterCode').value = '';
        loadHistory();
    };

    document.getElementById('exportBtn').onclick = async () => {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const cFilt = document.getElementById('clientFilter').value.toLowerCase();
        if(!start || !end) return alert('Select dates');

        const snap = await firebase.database().ref('withdrawals').once('value');
        const rows = [['Date', 'Code', 'Description', 'Client', 'Quantity']];
        snap.forEach(item => {
            const d = item.val();
            if(d.date >= start && d.date <= end && (!cFilt || d.client.toLowerCase().includes(cFilt))) {
                rows.push([d.date, d.code, d.description, d.client, d.qty]);
            }
        });

        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Withdrawals');
        XLSX.writeFile(wb, `Withdrawals_${start}_to_${end}.xlsx`);
    };

    document.getElementById('showdashboard').onclick = () => window.location.href = "index.html";

    loadProducts();
    loadHistory();
</script>

</body>
</html>
